<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.cdnfonts.com/css/spongeboy-me-bob" rel="stylesheet">
</head>
<body class="signinBody">
    <div class="customerSignin">
    <div class="adSignin">
        <div class="greetingsSignin">
            <h1>Welcome to the crew, sailor!</h1>
            <p>Big cravings. Good company. Your favorites are one login away.</p>
            </div>
            <img class="burgerPicSignin" src="images/Screenshot 2026-11-18 095930.png" alt="">
            <p>A Bikini Bottom original.</p>
        </div>
    

    <div class="signinBox">
        <div class="welcomeSignin">
        <p>Nice to meet you!</p>
        <h1>Create your account</h1>
        </div>

    <div class="signin-signup">
        <form id="signin-form">
            <h2 class="titleSignin">Sign-in</h2>
            <h3>Enter your email and password.</h3>

            <div class="input-fieldSignin">
                <input type="text" id="email" placeholder="email">
            </div>
            <div class="input-fieldSignin">
                <input type="password" id="password" placeholder="password">
            </div>
            <label>
                <input type="checkbox" id="show-password"> Show Password
            </label>
            <input type="submit" value="Sign-in" class="btn-solid">
        </form>
        <a href="index.html">Once you're finished, log in here!</a>
    </div>
    </div>

    <script src="signup.js"></script>
</body>
</html>
