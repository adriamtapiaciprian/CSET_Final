<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log-In</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.cdnfonts.com/css/spongeboy-me-bob" rel="stylesheet">
</head>
<body class="loginBody">
    <div class="customerLogin">
    <div class="ad">
        <div class="greetings">
            <h1>Welcome back, shipmate!</h1>
            <p>Big cravings. Good company. Your favorites are one login away.</p>
            </div>
            <img class="burgerPic" src="images/Screenshot 2026-11-18 095930.png" alt="">
            <p>A Bikini Bottom original.</p>
        </div>
    

    <div class="loginBox">
        <div class="welcome">
        <p>NICE TO SEA YOU AGAIN</p>
        <h1>Welcome back!</h1>
        </div>

    <div class="login-logup">
        <form id="login-form">
            <h2 class="title">Log-in</h2>
            <h3>Enter your email and password.</h3>

            <div class="input-field">
                <input type="text" id="email" placeholder="email">
            </div>
            <div class="input-field">
                <input type="password" id="password" placeholder="password">
            </div>
            <label>
                <input type="checkbox" id="show-password"> Show Password
            </label>
            <input type="submit" value="Log-in" class="btn-solid">
        </form>
        <a href="">Or continue as a guest</a>
        <a href="signup.html">Don't have an account? Sign in here!</a>
        <a href="managerLogin.html">If you're a manager, log in here!</a>
    </div>
    </div>
    

    <script src="logic.js"></script>
</body>
</html>
