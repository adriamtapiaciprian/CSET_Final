<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Login</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.cdnfonts.com/css/spongeboy-me-bob" rel="stylesheet">
</head>
<body class="ManagerLoginBody">
    <div class="loginBoxManager">
        <div class="welcomeManager">
        <p>Ahoy Captain!</p>
        <h1>Let's get things rolling!</h1>
        </div>

    <div class="login-logupManager">
        <form id="login-form">
            <h2 class="titleManager">Manager Log-in</h2>
            <h3>Enter the manager exclusive email and password.</h3>

            <div class="input-fieldManager">
                <input type="text" id="email" placeholder="email">
            </div>
            <div class="input-fieldManager">
                <input type="password" id="password" placeholder="password">
            </div>
            <label>
                <input type="checkbox" id="show-password"> Show Password
            </label>
            <input type="submit" value="Log-in" class="btn-solid">
        </form>
        <a href="index.html">If you're a customer, your in the wrong ship.</a>
    </div>
    </div>
</body>
</html>
